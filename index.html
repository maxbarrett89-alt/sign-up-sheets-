<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DDSO — Join Our List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ---------- DDSO BRAND ---------- */
  :root {
    --black: #111111;
    --red: #d6262b;       /* DDSO red */
    --gray: #d9d9d9;      /* logo tile gray */
    --gray-dark: #6b6b6b;
    --paper: #ffffff;
    --field: #f4f4f4;
    --ink: #111111;
    --ok: #1f7a43;
    --err: #c4161c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121212; --field: #1e1e1e; --ink: #f2f2f2; --gray: #3a3a3a; --gray-dark: #a8a8a8; --black: #f2f2f2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] { --paper: #121212; --field: #1e1e1e; --ink: #f2f2f2; --gray: #3a3a3a; --gray-dark: #a8a8a8; --black: #f2f2f2; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--paper); color: var(--ink);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 22px 32px; position: relative; }

  /* Header: logo + bold condensed headline with the red rule */
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo-card { flex: 0 0 auto; background: #fff; border-radius: 10px; padding: 6px; line-height: 0; }
  .logo-card img { width: 96px; height: auto; display: block; }
  h1 {
    font-family: "Anton", Impact, "Arial Narrow Bold", sans-serif; font-weight: 400;
    text-transform: uppercase; letter-spacing: .01em;
    font-size: clamp(1.9rem, 8vw, 2.6rem); line-height: 1.02; margin: 0; color: var(--black);
  }
  .rule { height: 4px; background: var(--red); margin: 18px 0 14px; border-radius: 2px; }
  .lede { margin: 0; font-size: 1.08rem; line-height: 1.5; color: var(--gray-dark); }


  form { margin-top: 26px; display: grid; gap: 18px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .98rem; }
  .hint { font-weight: 400; color: var(--gray-dark); }
  input[type=text], input[type=email], input[type=tel] {
    width: 100%; font: inherit; font-size: 1.15rem; padding: 14px;
    border: 2px solid transparent; border-bottom: 2px solid var(--gray); border-radius: 6px 6px 0 0;
    background: var(--field); color: var(--ink);
  }
  input:focus { outline: none; border-bottom-color: var(--red); }

  .toggle { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 6px; background: var(--field); cursor: pointer; }
  .toggle input { width: 24px; height: 24px; accent-color: var(--red); margin: 2px 0 0; flex: 0 0 auto; }
  .toggle span { font-size: 1.02rem; line-height: 1.35; }
  .toggle small { font-size: .85rem; }

  button.submit {
    font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .04em;
    font-size: 1.35rem; padding: 15px; border: 0; border-radius: 6px;
    background: #111; color: #fff; cursor: pointer; position: relative;
    box-shadow: inset 0 -4px 0 var(--red);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.submit { background: #fff; color: #111; } }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .error { color: var(--err); font-size: .95rem; min-height: 1.2em; margin: -6px 0 0; font-weight: 600; }
  .fine { text-align: center; font-size: .9rem; color: var(--gray-dark); margin-top: 22px; }

  /* Thank-you screen */
  .thanks { display: none; text-align: center; padding: 56px 8px; }
  .thanks.show { display: block; animation: pop .5s ease-out; }
  .thanks img { width: 110px; background: #fff; border-radius: 10px; padding: 6px; }
  .thanks h2 { font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 2.4rem; margin: 18px 0 6px; color: var(--black); }
  .thanks .rule { width: 80px; margin: 10px auto 16px; }
  .thanks p { font-size: 1.1rem; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .thanks.show { animation: none; } }

  /* Staff panel */
  .staff { margin-top: 36px; border-top: 1px solid var(--gray); padding-top: 14px; font-size: .9rem; }
  .staff summary { cursor: pointer; color: var(--gray-dark); }
  .staff .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
  .staff button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .status-dot.off { background: var(--err); }
</style>
</head>

    <p id="sendStatus" style="font-size:.95rem"></p>

<script>
/* =========================================================
   PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES
   (see README.md for the 2-minute setup)
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkksVJoq3kie4Yj1w7y8YstXsHXD_gEg-k8Hd9WPLKBku6kbhNNfxDvCFbblEQbdjbpA/exec";

const QUEUE_KEY = "signup-queue";
const LOG_KEY = "signup-log";

function load(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

function updateStaff() {
  const q = load(QUEUE_KEY).length, total = load(LOG_KEY).length;
  document.getElementById("counts").textContent =
    `${total} sign-up${total === 1 ? "" : "s"} on this device` + (q ? ` · ${q} waiting to send` : "");
  const online = navigator.onLine;
  document.getElementById("dot").classList.toggle("off", !online);
  document.getElementById("netStatus").textContent = online ? "Online" : "Offline — sign-ups will be saved and sent later";
}

async function send(entry) {
  if (!SCRIPT_URL) throw new Error("No sheet connected yet — paste your Apps Script URL into SCRIPT_URL.");
  // text/plain keeps this a "simple" request, so Google answers and we can confirm it saved
  const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(entry) });
  const text = (await res.text()).trim();
  if (text !== "ok") throw new Error("The sheet didn’t confirm the save. Check the Apps Script deployment.");
}

function showStatus(msg, good) {
  const el = document.getElementById("sendStatus");
  el.textContent = msg; el.style.color = good ? "var(--ok)" : "var(--err)";
}

async function flushQueue() {
  let q = load(QUEUE_KEY);
  const remaining = [];
  for (const entry of q) {
    if (!SCRIPT_URL) { remaining.push(entry); continue; }
    try { await send(entry); } catch (e) { remaining.push(entry); }
  }
  save(QUEUE_KEY, remaining);
  updateStaff();
}

const form = document.getElementById("signup");
const errorEl = document.getElementById("error");
const nameEl = document.getElementById("name"), emailEl = document.getElementById("email"), itemEl = document.getElementById("item");
const phoneEl = document.getElementById("phone"), textOptinEl = document.getElementById("textOptin");

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  errorEl.textContent = "";
  const name = nameEl.value.trim();
  const email = emailEl.value.trim();
  if (!name) { errorEl.textContent = "Please add your name."; nameEl.focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errorEl.textContent = "That email doesn’t look quite right."; emailEl.focus(); return; }

  const phoneDigits = phoneEl.value.replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  if (phoneEl.value.trim() && phoneDigits.length !== 10) { errorEl.textContent = "Please enter a 10-digit phone number, or leave it blank."; phoneEl.focus(); return; }
  if (textOptinEl.checked && !phoneDigits) { errorEl.textContent = "Add your mobile number to get text updates."; phoneEl.focus(); return; }
  const phone = phoneDigits ? `(${phoneDigits.slice(0,3)}) ${phoneDigits.slice(3,6)}-${phoneDigits.slice(6)}` : "";

  const entry = {
    name, email,
    item: itemEl.value.trim(),
    optin: document.getElementById("optin").checked ? "Yes" : "No",
    date: new Date().toLocaleString(),
    phone,
    textOptin: phone && textOptinEl.checked ? "Yes" : "No"
  };

  const log = load(LOG_KEY); log.push(entry); save(LOG_KEY, log);   // local backup always
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Saving…";
  try { await send(entry); showStatus("✓ Saved to the Google Sheet", true); }
  catch (e) { const q = load(QUEUE_KEY); q.push(entry); save(QUEUE_KEY, q); showStatus("Saved on this device only. " + e.message, false); }
  btn.disabled = false; btn.textContent = "Sign me up";
  updateStaff();

  // Thank-you screen, then reset for the next person
  document.getElementById("thanksName").textContent = `Thank you, ${name.split(" ")[0]}!`;
  document.getElementById("formView").style.display = "none";
  document.getElementById("thanksView").classList.add("show");
  clearTimeout(resetTimer);
  resetTimer = setTimeout(resetForm, 4000);
});

let resetTimer;
function resetForm() {
  clearTimeout(resetTimer);
  form.reset(); document.getElementById("optin").checked = true;
  document.getElementById("thanksView").classList.remove("show");
  document.getElementById("formView").style.display = "";
  nameEl.focus();
}
document.getElementById("nextBtn").addEventListener("click", resetForm);

document.getElementById("testBtn").addEventListener("click", async () => {
  const out = document.getElementById("testResult");
  out.textContent = "Testing…";
  if (!SCRIPT_URL) { out.textContent = "No Apps Script URL pasted into SCRIPT_URL yet."; return; }
  try {
    const res = await fetch(SCRIPT_URL);
    const t = (await res.text()).trim();
    out.textContent = t === "connected" ? "✓ Connected to your sheet" : "Reached Google, but got an unexpected reply. Redeploy the script (see README).";
  } catch (e) { out.textContent = "Couldn’t reach the script. Check the URL ends in /exec and access is set to Anyone."; }
});

document.getElementById("retryBtn").addEventListener("click", flushQueue);
document.getElementById("csvBtn").addEventListener("click", () => {
  const rows = [["Your Name","Email","What You Took Home","Keep Me Posted?","Date","Phone","OK to Text?"]]
    .concat(load(LOG_KEY).map(e => [e.name, e.email, e.item, e.optin, e.date, e.phone, e.textOptin]));
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "purchaser-signups.csv"; a.click();
});

window.addEventListener("online", () => { updateStaff(); flushQueue(); });
window.addEventListener("offline", updateStaff);
updateStaff();
if (navigator.onLine) flushQueue();

</script>
